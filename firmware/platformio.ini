; BluOS Knob firmware for M5StickC-class boards (ESP32-PICO-D4).
; Run through the justfile (`just fw-build`, `just fw-test`, ...): it invokes
; PlatformIO via uvx so nothing is installed globally.

[platformio]
default_envs = m5stick

[env:m5stick]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
; No OTA (plan non-goal): one 3 MB app partition fits BLE + Wi-Fi + HTTP + M5Unified.
board_build.partitions = huge_app.csv
lib_deps =
    m5stack/M5Unified@^0.2.2
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11

; Host-native tests for the portable core in lib/knob_core (no Arduino, no hardware).
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -D UNITY_INCLUDE_DOUBLE
